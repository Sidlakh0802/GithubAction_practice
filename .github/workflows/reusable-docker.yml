name: Reusable Docker Build and Push
on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      tag:
        required: true
        type: string
    secrets:
      docker_username:
        required: true
      docker_token:
        required: true
    outputs:
      image_url:
        description: "Full image path"
        value: ${{ jobs.docker.outputs.url }}

jobs:
  docker:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ inputs.image_name }}:${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.docker_username }}
          password: ${{ secrets.docker_token }}
          
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ inputs.image_name }}:${{ inputs.tag }},${{ inputs.image_name }}:sha-${{ github.sha }}

