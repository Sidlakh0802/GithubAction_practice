name: PR Pipeline
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  call-build-test:
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      run_tests: true
      
  pr-comment:
    needs: call-build-test
    runs-on: ubuntu-latest
    steps:
      - run: echo "PR checks passed for branch: ${{ github.head_ref }}"

