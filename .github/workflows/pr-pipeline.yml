name: PR Pipeline
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

# Task 4: Limit permissions (Least Privilege)
permissions:
  contents: read
  pull-requests: write

jobs:
  call_build_test:
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      run_tests: true
      
  dependency_review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Check Dependencies for Vulnerabilities
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical
          
  pr-comment:
    needs: [call_build_test, dependency_review]
    runs-on: ubuntu-latest
    steps:
      - run: echo "PR security and build checks passed for branch: ${{ github.head_ref }}"
